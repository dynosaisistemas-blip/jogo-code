<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5cad">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rumo à Receita">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Rumo à Receita</title>
<meta name="description" content="Sistema de estudos para Auditor Fiscal da Receita Federal (AFRFB): ciclo de estudos, materiais, flashcards com repetição espaçada, questões e revisões.">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f8;--surface:#ffffff;--surface-2:#f0f3f7;--surface-3:#e4e9f0;--text:#0f1a2a;--muted:#5f6b7c;--faint:#8b95a5;
  --line:#e2e7ee;--accent:#0f4c9c;--accent-strong:#0a3b7a;--accent-2:#e6effb;--accent-ink:#ffffff;
  --ok:#157347;--ok-bg:#e3f5ea;--warn:#9a5b00;--warn-bg:#fff2dc;--bad:#b3261e;--bad-bg:#fce8e6;
  --gold:#c99a2e;--shadow:0 1px 2px rgba(15,26,42,.05),0 4px 14px -6px rgba(15,26,42,.08);
  --side:#0b2447;--side-2:#133a6b;--side-text:#dbe6f6;--side-muted:#8fa6c8;--r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1118;--surface:#141b25;--surface-2:#1b2431;--surface-3:#243041;--text:#e8edf4;--muted:#9aa7b8;--faint:#6f7c8e;
  --line:#243041;--accent:#6ea8f0;--accent-strong:#8fbcf5;--accent-2:#182a44;--accent-ink:#0c1118;
  --ok:#5fcf93;--ok-bg:#15301f;--warn:#f1b35a;--warn-bg:#34260e;--bad:#f28b7d;--bad-bg:#3b1a16;--gold:#e0b24c;--shadow:none;
  --side:#0a1420;--side-2:#132235;--side-text:#dbe6f6;--side-muted:#7f93b0}}
:root[data-theme="dark"]{
  --bg:#0c1118;--surface:#141b25;--surface-2:#1b2431;--surface-3:#243041;--text:#e8edf4;--muted:#9aa7b8;--faint:#6f7c8e;
  --line:#243041;--accent:#6ea8f0;--accent-strong:#8fbcf5;--accent-2:#182a44;--accent-ink:#0c1118;
  --ok:#5fcf93;--ok-bg:#15301f;--warn:#f1b35a;--warn-bg:#34260e;--bad:#f28b7d;--bad-bg:#3b1a16;--gold:#e0b24c;--shadow:none;
  --side:#0a1420;--side-2:#132235;--side-text:#dbe6f6;--side-muted:#7f93b0}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
/* ---- layout ---- */
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
aside{background:var(--side);color:var(--side-text);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.logo{display:flex;align-items:center;gap:12px;padding:4px 10px 18px}
.logo .mark{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#1f6fd1,#0b2447 120%);display:grid;place-items:center;font-size:21px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.logo b{display:block;font-size:15px;letter-spacing:-.01em}.logo small{display:block;color:var(--side-muted);font-size:11.5px;font-weight:500}
.navlbl{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--side-muted);padding:12px 12px 4px}
aside nav button{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;color:var(--side-text);padding:9px 12px;border-radius:9px;font:inherit;font-weight:500;cursor:pointer;text-align:left;opacity:.85}
aside nav button:hover{background:var(--side-2);opacity:1}
aside nav button.on{background:var(--side-2);opacity:1;font-weight:600;box-shadow:inset 3px 0 0 #5fa0f0}
aside nav button .ic{width:20px;text-align:center;font-size:16px}
aside nav button .cnt{margin-left:auto;background:#5fa0f0;color:#061329;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px}
.side-foot{margin-top:auto;padding:10px 12px;color:var(--side-muted);font-size:12px;display:flex;align-items:center;gap:8px}
.side-foot button{background:var(--side-2);border:0;color:var(--side-text);border-radius:8px;padding:6px 9px;cursor:pointer;font:inherit;font-size:12px}
.content{min-width:0}
.topbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;gap:14px}
.topbar h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em}
.topbar .sub{color:var(--muted);font-size:13px}
.topbar .sp{flex:1}
main{padding:24px 28px 80px;max-width:1240px}
.bottomnav{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}aside{display:none}
  .topbar{padding:12px 16px}.topbar h1{font-size:17px}
  main{padding:16px 16px 92px}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
  .bottomnav button{background:none;border:0;color:var(--muted);font:inherit;font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 6px;border-radius:10px;flex:1;cursor:pointer;position:relative}
  .bottomnav button .ic{font-size:20px;line-height:1}
  .bottomnav button.on{color:var(--accent)}
  .bottomnav button .cnt{position:absolute;top:0;right:12%;background:var(--bad);color:#fff;font-size:10px;padding:0 5px;border-radius:99px;font-weight:700}
  .more-menu{position:fixed;left:0;right:0;bottom:62px;z-index:11;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(0,0,0,.12);padding:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .more-menu button{background:var(--surface-2);border:0;border-radius:10px;padding:12px 6px;font:inherit;font-size:12px;font-weight:600;color:var(--text);cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center}
  .more-menu button .ic{font-size:20px}
}
/* ---- components ---- */
h2{font-size:21px;margin:0 0 6px;letter-spacing:-.015em;font-weight:700}
h3{font-size:15px;margin:0 0 12px;font-weight:700;letter-spacing:-.005em}
.lead{color:var(--muted);margin:0 0 18px;font-size:14px;max-width:70ch}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.g4,.g3,.g2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.card.pad-sm{padding:14px 16px}
.card.hero{background:linear-gradient(135deg,var(--side) 0%,#143f78 60%,#1f6fd1 130%);color:#fff;border:0}
.card.hero .muted,.card.hero .lead{color:#b9cdea}
.card.hero h2{color:#fff}
.stat{display:flex;flex-direction:column;gap:6px}
.stat .lbl{font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stat b{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.stat .d{font-size:13px;color:var(--muted)}
.stat .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--accent-2);color:var(--accent);font-size:18px;margin-bottom:4px}
.muted{color:var(--muted)}.small{font-size:13px}.faint{color:var(--faint)}
button.btn,label.btn,a.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:9px 16px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;transition:filter .15s,transform .05s;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:var(--surface-2);color:var(--text)}
.btn.outline{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.ok{background:var(--ok);color:#fff}.btn.bad{background:var(--bad);color:#fff}.btn.warn{background:var(--warn);color:#fff}
.btn.light{background:rgba(255,255,255,.14);color:#fff}
input,select,textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-2)}
textarea{min-height:90px;resize:vertical}
label.small.muted{display:block}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{flex:1 1 160px}.row>.btn,.row>button{flex:0 0 auto}
.prog{height:8px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#3f8ae6);border-radius:99px;transition:width .4s}
.disc{border-bottom:1px solid var(--line);padding:12px 0}
.disc:last-of-type{border:0}
.disc summary{cursor:pointer;display:flex;gap:12px;align-items:center;list-style:none}
.disc summary::-webkit-details-marker{display:none}
.disc summary .nm{flex:1;font-weight:600;min-width:0}
.tag{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--surface-3);color:var(--muted);letter-spacing:.01em}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.bad{background:var(--bad-bg);color:var(--bad)}.tag.ac{background:var(--accent-2);color:var(--accent)}
.topic{display:flex;gap:8px;align-items:center;padding:6px 0 6px 6px;font-size:14px}
.topic .t{flex:1;min-width:0}
.topic select{width:auto;padding:4px 8px;font-size:13px;border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border:0}
th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.timer{font-size:64px;font-weight:800;font-variant-numeric:tabular-nums;text-align:center;letter-spacing:-.03em;margin:8px 0;color:var(--accent-strong)}
.flash{min-height:220px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:19px;line-height:1.5;white-space:pre-wrap;padding:28px;background:var(--surface-2);border-radius:12px;margin:10px 0 14px}
.alt{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;font:inherit;color:var(--text);cursor:pointer;transition:border-color .12s,background .12s}
.alt:hover{border-color:var(--accent);background:var(--accent-2)}
.alt.right{background:var(--ok-bg);border-color:var(--ok)}.alt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.reader{max-height:75vh;overflow:auto;background:var(--surface-2);border-radius:12px;padding:12px}
.reader canvas{display:block;max-width:100%;margin:0 auto 12px;box-shadow:0 2px 8px rgba(0,0,0,.18);border-radius:4px}
.reader pre{white-space:pre-wrap;font:inherit;margin:0;background:var(--surface);padding:18px;border-radius:10px;line-height:1.7}
.list-item{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border:0}
.list-item .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;padding:34px 16px;color:var(--muted)}
.empty .big{font-size:34px;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(8px);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:10px;font-size:14px;font-weight:500;z-index:30;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:900px){.toast{bottom:84px}}
.hide{display:none!important}
.bars{display:flex;align-items:flex-end;gap:5px;height:120px}
.bars div{flex:1;background:var(--accent-2);border-radius:4px 4px 0 0;min-height:3px;position:relative;overflow:hidden}
.bars div i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,#3f8ae6,var(--accent));border-radius:4px 4px 0 0}
.bars-lbl{display:flex;gap:5px;font-size:10.5px;color:var(--faint);margin-top:6px}.bars-lbl span{flex:1;text-align:center}
.ring{--p:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface-3) 0);display:grid;place-items:center;flex:0 0 auto}
.ring span{width:72px;height:72px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:800;font-size:17px;letter-spacing:-.02em}
.todo{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--surface-2);margin-bottom:8px}
.todo .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--surface);font-size:17px;flex:0 0 auto}
.todo .tx{flex:1;min-width:0}.todo .tx b{display:block;font-size:14px}.todo .tx span{font-size:12.5px;color:var(--muted)}
code{background:var(--surface-3);padding:1px 6px;border-radius:5px;font-size:13px}
pre.code{background:var(--surface-2);padding:14px;border-radius:10px;overflow:auto;font-size:12.5px;line-height:1.6}
.kbd{font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted);background:var(--surface)}
@media (max-width:560px){.timer{font-size:48px}}
</style>
</head>
<body>
<div class="shell">
<aside>
  <div class="logo"><div class="mark">🏛️</div><div><b>Rumo à Receita</b><small>Auditor Fiscal · RFB</small></div></div>
  <div class="navlbl">Estudo</div>
  <nav id="nav">
    <button data-v="painel" class="on"><span class="ic">▦</span>Painel</button>
    <button data-v="estudar"><span class="ic">⏱</span>Estudar</button>
    <button data-v="edital"><span class="ic">☰</span>Edital</button>
    <button data-v="revisoes"><span class="ic">↻</span>Revisões<span class="cnt hide" id="cRev"></span></button>
    <div class="navlbl">Conteúdo</div>
    <button data-v="materiais"><span class="ic">▤</span>Materiais</button>
    <button data-v="flash"><span class="ic">▭</span>Flashcards<span class="cnt hide" id="cFc"></span></button>
    <button data-v="questoes"><span class="ic">?</span>Questões</button>
    <button data-v="leis"><span class="ic">§</span>Lei seca</button>
    <div class="navlbl">Sistema</div>
    <button data-v="dados"><span class="ic">⇅</span>Importar / Backup</button>
  </nav>
  <div class="side-foot"><span id="sideFoot"></span><span style="flex:1"></span><button id="themeBtn" title="Alternar tema">◐ Tema</button></div>
</aside>
<div class="content">
  <div class="topbar"><div><h1 id="tbTitle">Painel</h1><div class="sub" id="tbSub"></div></div><span class="sp"></span><span class="tag ac" id="hdrCount"></span></div>
  <main id="app"></main>
</div>
</div>
<div class="bottomnav" id="bnav">
  <button data-v="painel" class="on"><span class="ic">▦</span>Painel</button>
  <button data-v="estudar"><span class="ic">⏱</span>Estudar</button>
  <button data-v="flash"><span class="ic">▭</span>Cards<span class="cnt hide" id="cFc2"></span></button>
  <button data-v="materiais"><span class="ic">▤</span>Materiais</button>
  <button id="bnMore"><span class="ic">⋯</span>Mais</button>
</div>
<div class="more-menu hide" id="moreMenu">
  <button data-v="edital"><span class="ic">☰</span>Edital</button>
  <button data-v="revisoes"><span class="ic">↻</span>Revisões</button>
  <button data-v="questoes"><span class="ic">?</span>Questões</button>
  <button data-v="leis"><span class="ic">§</span>Lei seca</button>
  <button data-v="dados"><span class="ic">⇅</span>Importar</button>
  <button id="themeBtn2"><span class="ic">◐</span>Tema</button>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============ Dados-base: edital AFRFB (referência: último edital, FGV 2022 — ajuste quando sair o novo) ============ */
const EDITAL_BASE = [
  ['Língua Portuguesa','Gerais',['Compreensão e interpretação de textos','Tipologia e gêneros textuais','Ortografia e acentuação','Classes de palavras','Sintaxe da oração e do período','Concordância nominal e verbal','Regência e crase','Pontuação','Coesão e coerência','Reescrita de frases']],
  ['Língua Inglesa','Gerais',['Compreensão de textos','Vocabulário e expressões','Gramática aplicada à leitura']],
  ['Raciocínio Lógico-Matemático','Gerais',['Lógica proposicional','Equivalências e negações','Argumentação lógica','Conjuntos','Análise combinatória','Probabilidade','Porcentagem e juros','Matrizes e sistemas lineares','Sequências e progressões']],
  ['Estatística','Gerais',['Estatística descritiva','Medidas de posição e dispersão','Distribuições de probabilidade','Amostragem','Inferência e testes de hipótese','Correlação e regressão']],
  ['Economia e Finanças Públicas','Gerais',['Microeconomia','Macroeconomia','Funções do governo','Falhas de mercado e bens públicos','Teoria da tributação','Orçamento público e LRF','Política fiscal e dívida pública']],
  ['Administração Geral e Pública','Gerais',['Funções administrativas','Gestão de pessoas','Gestão de processos e projetos','Governança e compliance','Modelos de administração pública','Controle da administração']],
  ['Direito Constitucional','Gerais',['Teoria da Constituição','Direitos e garantias fundamentais','Organização do Estado','Organização dos Poderes','Controle de constitucionalidade','Sistema Tributário Nacional na CF','Finanças públicas na CF','Ordem econômica e financeira']],
  ['Direito Administrativo','Gerais',['Princípios da Administração','Organização administrativa','Atos administrativos','Poderes administrativos','Agentes públicos e Lei 8.112/90','Licitações e contratos (Lei 14.133/21)','Responsabilidade civil do Estado','Improbidade administrativa','Processo administrativo (Lei 9.784/99)','Controle da Administração']],
  ['Direito Tributário','Específicos',['Competência tributária','Limitações ao poder de tributar e imunidades','Espécies tributárias','Legislação tributária (CTN arts. 96-112)','Obrigação tributária','Responsabilidade tributária','Crédito tributário e lançamento','Suspensão, extinção e exclusão do crédito','Garantias e privilégios','Administração tributária','Reforma Tributária (EC 132/2023, LC 214/2025: IBS, CBS, IS)']],
  ['Legislação Tributária','Específicos',['Imposto de Renda PF','Imposto de Renda PJ e CSLL','PIS/Pasep e Cofins','IPI','IOF e ITR','Contribuições previdenciárias','Simples Nacional','Processo administrativo fiscal (Decreto 70.235/72)','CBS e transição da reforma']],
  ['Contabilidade Geral e Avançada','Específicos',['Estrutura conceitual (CPC 00)','Patrimônio e escrituração','Demonstrações contábeis (BP, DRE, DFC, DVA, DMPL)','Estoques (CPC 16)','Imobilizado e intangível','Redução ao valor recuperável (CPC 01)','Investimentos: equivalência patrimonial','Combinação de negócios e consolidação','Arrendamentos (CPC 06)','Instrumentos financeiros','Tributos sobre o lucro (CPC 32)','Análise das demonstrações']],
  ['Auditoria','Específicos',['Normas de auditoria (NBC TA)','Planejamento e materialidade','Risco de auditoria e controles internos','Evidência e procedimentos','Amostragem em auditoria','Papéis de trabalho','Relatório e opinião do auditor']],
  ['Legislação Aduaneira','Específicos',['Jurisdição aduaneira','Regulamento Aduaneiro','Tributos sobre o comércio exterior','Despacho aduaneiro de importação e exportação','Regimes aduaneiros especiais','Infrações e penalidades','Valoração aduaneira']],
  ['Comércio Internacional','Específicos',['Teorias do comércio internacional','OMC e acordos (GATT)','Mercosul e integração','Classificação fiscal (NCM/SH)','Incoterms','Defesa comercial','Câmbio e balanço de pagamentos']],
];

/* ============ Estado ============ */
const KEY='rumoReceita:v1';
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const hoje=()=>new Date().toISOString().slice(0,10);

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim()}

/* ============ IndexedDB para arquivos (PDFs ficam só no seu navegador) ============ */
const idb={db:null,
  open(){return this.db?Promise.resolve(this.db):new Promise((ok,err)=>{const r=indexedDB.open('rumoReceita',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('arquivos');r.onsuccess=()=>ok(this.db=r.result);r.onerror=()=>err(r.error)})},
  async put(k,v){const db=await this.open();return new Promise((ok,err)=>{const t=db.transaction('arquivos','readwrite');t.objectStore('arquivos').put(v,k);t.oncomplete=ok;t.onerror=()=>err(t.error)})},
  async get(k){const db=await this.open();return new Promise((ok,err)=>{const r=db.transaction('arquivos').objectStore('arquivos').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>err(r.error)})},
  async del(k){const db=await this.open();return new Promise(ok=>{const t=db.transaction('arquivos','readwrite');t.objectStore('arquivos').delete(k);t.oncomplete=ok})}
};

/* ============ Utilidades de UI ============ */
const $=s=>document.querySelector(s);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2400)}
function optsDisc(sel,todas){return (todas?'<option value="">Todas as disciplinas</option>':'')+S.disciplinas.map(d=>`<option value="${d.id}" ${d.id===sel?'selected':''}>${esc(d.nome)}</option>`).join('')}
function progDisc(d){const n=d.topicos.length;if(!n)return 0;return d.topicos.reduce((a,t)=>a+(t.status===2?1:t.status===1?.5:0),0)/n}
function minutosPor(discId,dias){const lim=dias?addDias(hoje(),-dias+1):'';return S.sessoes.filter(s=>(!discId||s.disc===discId)&&(!lim||s.data>=lim)).reduce((a,s)=>a+s.min,0)}
function fmtH(min){const h=Math.floor(min/60),m=Math.round(min%60);return h?`${h}h${String(m).padStart(2,'0')}`:`${m}min`}
function cardsDue(discId){const h=hoje();return S.cards.filter(c=>c.due<=h&&(!discId||c.disc===discId))}
function revisoesPendentes(){const h=hoje(),out=[];S.disciplinas.forEach(d=>d.topicos.forEach(t=>t.revisoes.forEach(r=>{if(!r.feita&&r.data<=h)out.push({d,t,r})})));return out}
function streak(){const dias=new Set(S.sessoes.map(s=>s.data));let n=0,d=hoje();if(!dias.has(d))d=addDias(d,-1);while(dias.has(d)){n++;d=addDias(d,-1)}return n}
function acertos(discId){let a=0,t=0;S.questoes.forEach(q=>{if(discId&&q.disc!==discId)return;q.hist.forEach(h=>{t++;if(h.ok)a++})});return {a,t,p:t?a/t:0}}

  for(const [id,n] of [['#cFc',fc],['#cFc2',fc],['#cRev',rv]]){const el=$(id);el.textContent=n;el.classList.toggle('hide',!n)}

const openDisc=new Set();
function acharTopico(id){for(const d of S.disciplinas){const t=d.topicos.find(t=>t.id===id);if(t)return t}}
function setStatus(t,st){
  if(st===2&&t.status!==2){t.estudadoEm=hoje();t.revisoes=[1,7,30].map(n=>({data:addDias(hoje(),n),dias:n,feita:false}))}
  t.status=st;
}

/* ============ Estudar: ciclo + cronômetro ============ */
function cicloLista(){ // ciclo ponderado: cada disciplina aparece "peso" vezes, intercalada
  const arr=[];const max=Math.max(...S.disciplinas.map(d=>d.peso),1);
  for(let r=0;r<max;r++)S.disciplinas.forEach(d=>{if(d.peso>r)arr.push(d)});return arr;
}
function proximaDoCiclo(){const c=cicloLista();return c.length?c[S.config.cicloIdx%c.length]:{nome:'—',id:''}}

// Importa um arquivo (PDF, áudio ou vídeo). `meta` opcional vem do manifest do sincronizador.
async function addArquivo(discId,file,meta={}){
  const nome=file.name,n=nome.toLowerCase();const titulo=meta.titulo||nome.replace(/\.(pdf|mp3|m4a|ogg|mp4|webm)$/i,'');
  if(S.materiais.some(m=>m.disc===discId&&m.titulo===titulo))return false; // já existe
  const id=uid();
  if(/\.(mp3|m4a|ogg|wav)$/.test(n)||file.type.startsWith('audio/')){await idb.put(id,{blob:file});S.materiais.push({id,disc:discId,titulo,tipo:'audio',tam:file.size,criado:hoje()});salvar();return true}
  if(/\.(mp4|webm)$/.test(n)||file.type.startsWith('video/')){await idb.put(id,{blob:file});S.materiais.push({id,disc:discId,titulo,tipo:'video',tam:file.size,criado:hoje()});salvar();return true}
  if(!/\.pdf$/.test(n)&&file.type!=='application/pdf')return false;
  const buf=await file.arrayBuffer();let texto='',pag=0;
  try{const pdf=await pdfjsLib.getDocument({data:buf.slice(0)}).promise;pag=pdf.numPages;
    for(let i=1;i<=pag;i++){const p=await pdf.getPage(i);const tc=await p.getTextContent();texto+=`\n[pág. ${i}]\n`+tc.items.map(x=>x.str).join(' ')}}catch(e){console.warn(e)}
  await idb.put(id,{blob:new Blob([buf],{type:'application/pdf'}),texto});
  S.materiais.push({id,disc:discId,titulo,tipo:meta.tipo||tipoDe(titulo,'pdf'),paginas:pag,criado:hoje()});salvar();return true;
}
// Importa uma pasta (ou vários arquivos) do sincronizador: usa manifest.json se existir, senão a pasta/nome do arquivo.
async function importarPasta(files){
  const lista=[...files];let manifest=null;const mf=lista.find(f=>f.name==='manifest.json');
  if(mf){try{manifest=JSON.parse(await mf.text())}catch(e){}}
  const resolve=nome=>{let d=discPorNome(nome);if(!d&&nome){d={id:uid(),nome,bloco:'Específicos',peso:2,topicos:[]};S.disciplinas.push(d)}return d};
  let n=0,i=0;
  for(const f of lista){i++;if(f.name==='manifest.json')continue;
    const rel=(f.webkitRelativePath||f.name).split('/').slice(1).join('/')||f.name; // remove a pasta raiz
    const m=manifest?.materiais?.find(x=>x.arquivo===rel);
    const discNome=m?.disciplina||(rel.includes('/')?rel.split('/')[0]:'');
    const d=discNome?resolve(discNome):S.disciplinas[0];
    toast(`Importando ${i}/${lista.length}: ${f.name}`);
    if(await addArquivo(d.id,f,m||{}))n++;
  }
  // vídeos em streaming (só link) do manifest
  for(const m of manifest?.materiais||[]){if(!m.url)continue;const d=resolve(m.disciplina);if(S.materiais.some(x=>x.url===m.url))continue;
    S.materiais.push({id:uid(),disc:d.id,titulo:m.titulo,tipo:'video',url:m.url,criado:hoje()});n++}
  salvar();return n;
}

function quiz(){
  const pool=S.cards.filter(c=>!fcDisc||c.disc===fcDisc);const todos=S.cards;if(pool.length<2||todos.length<4)return toast('Crie ao menos 4 flashcards');
  const perg=[...pool].sort(()=>Math.random()-.5).slice(0,10);let i=0,acertos=0;const box=$('#quizBox');

    const c=perg[i];const dist=todos.filter(x=>x!==c&&x.verso!==c.verso).sort(()=>Math.random()-.5).slice(0,3);const alts=[c,...dist].sort(()=>Math.random()-.5);
    box.innerHTML=`<p style="margin:10px 0 6px"><span class="tag ac">${i+1}/${perg.length}</span> ${esc(c.frente)}</p>${alts.map((a,k)=>`<button class="alt" data-k="${k}">${esc(a.verso.slice(0,220))}${a.verso.length>220?'…':''}</button>`).join('')}`;

function avaliar(c,q){
  if(q<3){c.reps=0;c.intervalo=1}else{c.reps++;c.intervalo=c.reps===1?1:c.reps===2?6:Math.round(c.intervalo*c.ef)}
  c.ef=Math.max(1.3,c.ef+(.1-(5-q)*(.08+(5-q)*.02)));c.due=addDias(hoje(),q<3?0:c.intervalo);
  if(q<3)c.due=hoje(); // volta ainda hoje
}

function filaQuestoes(){return S.questoes.filter(q=>(!qDisc||q.disc===qDisc)&&(qModo==='todas'||(qModo==='ineditas'&&!q.hist.length)||(qModo==='erradas'&&q.hist.length&&!q.hist[q.hist.length-1].ok)))}
function questoes(){
  const fila=filaQuestoes();if(!qAtual||!fila.includes(qAtual)){qAtual=fila[Math.floor(Math.random()*fila.length)]||null;qResp=null}
  const ac=acertos(qDisc);
  $('#app').innerHTML=`
  <div class="row" style="margin-bottom:12px"><select id="qDisc">${optsDisc(qDisc,true)}</select>
    <select id="qModo"><option value="todas">Todas</option><option value="ineditas" ${qModo==='ineditas'?'selected':''}>Não resolvidas</option><option value="erradas" ${qModo==='erradas'?'selected':''}>Que errei por último</option></select>
    <span class="tag ac" style="flex:0 0 auto">${fila.length} na fila · ${ac.t?Math.round(ac.p*100)+'% de acerto':'sem histórico'}</span></div>
  <div class="card">${qAtual?`
    <div class="small muted">${esc(disc(qAtual.disc)?.nome||'')}${qAtual.fonte?' · '+esc(qAtual.fonte):''}</div>
    <p style="white-space:pre-wrap">${esc(qAtual.enunciado)}</p>
    ${qAtual.alternativas.map((a,i)=>`<button class="alt ${qResp!==null?(i===qAtual.correta?'right':i===qResp?'wrong':''):''}" data-a="${i}">${'ABCDE'[i]||i+1}) ${esc(a)}</button>`).join('')}
    ${qResp!==null?`<div class="card" style="background:var(--surface-2);margin-top:10px"><b>${qResp===qAtual.correta?'✅ Acertou!':'❌ Errou.'}</b> Gabarito: ${'ABCDE'[qAtual.correta]}<br>${esc(qAtual.comentario||'')}</div>
      <div class="row" style="margin-top:10px"><button class="btn" id="qProx">Próxima →</button><button class="btn ghost" id="qCard">Virar flashcard</button></div>`:''}`
   :'<div class="empty"><div class="big">?</div>Nenhuma questão nesta seleção.<br><span class="small">Cadastre abaixo ou importe um pacote.</span></div>'}
  </div>
  <div class="card" style="margin-top:14px"><details><summary style="cursor:pointer"><b>Cadastrar questão</b></summary>
    <div style="margin-top:10px"><div class="row"><select id="cqDisc">${optsDisc(qDisc||S.disciplinas[0]?.id)}</select><input id="cqFonte" placeholder="Fonte (ex.: FGV 2022 AFRFB)"></div>
    <textarea id="cqEn" placeholder="Enunciado" style="margin-top:8px"></textarea>
    ${[0,1,2,3,4].map(i=>`<div class="row" style="margin-top:6px"><label style="flex:0 0 auto"><input type="radio" name="cqC" value="${i}" ${i===0?'checked':''} style="width:auto"> ${'ABCDE'[i]}</label><input id="cqA${i}" placeholder="Alternativa ${'ABCDE'[i]}${i>1?' (opcional)':''}"></div>`).join('')}
    <textarea id="cqCom" placeholder="Comentário / fundamento" style="margin-top:8px"></textarea>
    <button class="btn" id="cqAdd" style="margin-top:8px">Salvar questão</button><span class="small muted"> Para Certo/Errado (Cebraspe), use A = Certo e B = Errado.</span></div></details></div>`;
  $('#qDisc').onchange=e=>{qDisc=e.target.value;qAtual=null;questoes()};
  $('#qModo').onchange=e=>{qModo=e.target.value;qAtual=null;questoes()};
  $('#app').onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.a!==undefined&&qResp===null){qResp=+b.dataset.a;qAtual.hist.push({d:hoje(),ok:qResp===qAtual.correta});salvar();questoes()}
    if(b.id==='qProx'){qAtual=null;questoes()}
    if(b.id==='qCard'){S.cards.push(novoCard(qAtual.disc,qAtual.enunciado,`${qAtual.alternativas[qAtual.correta]}\n\n${qAtual.comentario||''}`));salvar();toast('Flashcard criado')}
    if(b.id==='cqAdd'){const alts=[0,1,2,3,4].map(i=>$('#cqA'+i).value.trim());const en=$('#cqEn').value.trim();let c=+document.querySelector('input[name=cqC]:checked').value;
      const validas=alts.filter(Boolean);if(!en||validas.length<2)return toast('Preencha enunciado e ao menos 2 alternativas');
      c=validas.indexOf(alts[c]);if(c<0)return toast('A alternativa correta está vazia');
      S.questoes.push({id:uid(),disc:$('#cqDisc').value,enunciado:en,alternativas:validas,correta:c,comentario:$('#cqCom').value.trim(),fonte:$('#cqFonte').value.trim(),hist:[]});salvar();questoes();toast('Questão salva')}};
}

/* ============ Revisões ============ */
function revisoes(){
  const pend=revisoesPendentes();const futuras=[];const h=hoje();
  S.disciplinas.forEach(d=>d.topicos.forEach(t=>t.revisoes.forEach(r=>{if(!r.feita&&r.data>h)futuras.push({d,t,r})})));futuras.sort((a,b)=>a.r.data.localeCompare(b.r.data));
  const item=(x,btn)=>`<div class="list-item small"><span class="tag ${x.r.data<h?'bad':x.r.data===h?'warn':''}">${x.r.data.split('-').reverse().join('/')}</span><span class="grow"><b>${esc(x.t.nome)}</b> · ${esc(x.d.nome)} <span class="tag">${x.r.dias}d</span></span>${btn?`<button class="btn ok sm" data-ok="${x.t.id}|${x.r.dias}">Revisado</button>`:''}</div>`;
  $('#app').innerHTML=`
  <p class="lead">Quando você marca um tópico como <b>Concluído</b> no Edital, o sistema agenda revisões em 1, 7 e 30 dias.</p>
  <div class="card"><h3>Para hoje / atrasadas (${pend.length})</h3>${pend.map(x=>item(x,true)).join('')||'<p class="lead">Tudo em dia ✅</p>'}</div>
  <div class="card" style="margin-top:14px"><h3>Próximas</h3>${futuras.slice(0,30).map(x=>item(x,false)).join('')||'<p class="lead">Nada agendado.</p>'}</div>`;
  $('#app').onclick=e=>{const b=e.target.closest('[data-ok]');if(!b)return;const [tid,dias]=b.dataset.ok.split('|');const t=acharTopico(tid);const r=t.revisoes.find(r=>r.dias==dias);r.feita=true;salvar();render()};
}

/* ============ Lei seca ============ */
const LEIS_LINKS=[['Constituição Federal (arts. 145-169: Sistema Tributário e Finanças)','https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm'],['CTN — Lei 5.172/66','https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm'],['Lei 8.112/90 (servidores)','https://www.planalto.gov.br/ccivil_03/leis/l8112cons.htm'],['Lei 9.784/99 (processo administrativo)','https://www.planalto.gov.br/ccivil_03/leis/l9784.htm'],['Lei 14.133/21 (licitações)','https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2021/lei/l14133.htm'],['Decreto 70.235/72 (processo administrativo fiscal)','https://www.planalto.gov.br/ccivil_03/decreto/d70235cons.htm'],['Regulamento Aduaneiro — Decreto 6.759/09','https://www.planalto.gov.br/ccivil_03/_ato2007-2010/2009/decreto/d6759.htm'],['LC 214/2025 (IBS, CBS e IS)','https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp214.htm'],['Lei 9.430/96 (legislação tributária federal)','https://www.planalto.gov.br/ccivil_03/leis/l9430.htm'],['Lei 10.637/02 (PIS) e 10.833/03 (Cofins)','https://www.planalto.gov.br/ccivil_03/leis/2003/l10.833.htm']];
let leiDisc='';
function leis(){
  const lista=S.leis.filter(l=>!leiDisc||l.disc===leiDisc);
  $('#app').innerHTML=`
  <p class="lead">Guarde os artigos que mais caem, com seus grifos. Cada artigo pode virar flashcard com um clique. Os links abrem o texto oficial no Planalto.</p>
  <div class="grid g2">
    <div class="card"><h3>Novo artigo</h3>
      <div class="row"><select id="lDisc">${optsDisc(leiDisc||S.disciplinas[0]?.id)}</select><input id="lRef" placeholder="Referência (ex.: CTN, art. 150, §4º)"></div>
      <textarea id="lTxt" placeholder="Texto do artigo / dispositivo" style="margin-top:8px"></textarea>
      <input id="lNota" placeholder="Sua anotação / pegadinha da banca (opcional)" style="margin-top:8px">
      <button class="btn" id="lAdd" style="margin-top:8px">Salvar artigo</button></div>
    <div class="card"><h3>Textos oficiais</h3>${LEIS_LINKS.map(([n,u])=>`<div class="list-item small"><span class="grow">${esc(n)}</span><a class="btn ghost sm" href="${u}" target="_blank" rel="noopener" style="text-decoration:none">Abrir ↗</a></div>`).join('')}</div>
  </div>
  <div class="card" style="margin-top:14px"><div class="row" style="margin-bottom:6px"><h3 style="margin:0;flex:1 1 auto">Meus artigos (${lista.length})</h3><select id="leiFiltro" style="flex:0 1 260px">${optsDisc(leiDisc,true)}</select></div>
    ${lista.map(l=>`<div class="list-item" style="align-items:flex-start"><span>⚖️</span><span class="grow" style="white-space:normal"><b>${esc(l.ref)}</b> <span class="tag">${esc(disc(l.disc)?.nome||'')}</span><br><span style="white-space:pre-wrap">${esc(l.texto)}</span>${l.nota?`<br><span class="small" style="color:var(--warn)">✎ ${esc(l.nota)}</span>`:''}</span>
      <span style="display:flex;flex-direction:column;gap:4px"><button class="btn ghost sm" data-card="${l.id}" title="Virar flashcard">🃏</button><button class="btn ghost sm" data-rm="${l.id}">✕</button></span></div>`).join('')||'<p class="lead">Nenhum artigo salvo ainda.</p>'}</div>`;
  $('#leiFiltro').onchange=e=>{leiDisc=e.target.value;leis()};
  $('#lAdd').onclick=()=>{const ref=$('#lRef').value.trim(),t=$('#lTxt').value.trim();if(!ref||!t)return toast('Preencha referência e texto');S.leis.push({id:uid(),disc:$('#lDisc').value,ref,texto:t,nota:$('#lNota').value.trim()});salvar();leis();toast('Artigo salvo')};
  $('#app').onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.card){const l=S.leis.find(x=>x.id===b.dataset.card);S.cards.push(novoCard(l.disc,`O que diz: ${l.ref}?`,l.texto+(l.nota?`\n\n✎ ${l.nota}`:'')));salvar();toast('Flashcard criado')}
    if(b.dataset.rm){S.leis=S.leis.filter(x=>x.id!==b.dataset.rm);salvar();leis()}};
}

/* ============ Importar / Backup ============ */
const EXEMPLO_IMPORT={fonte:'Estratégia Concursos — e-mails',materiais:[{disciplina:'Direito Tributário',titulo:'Aula 00 — resumo',texto:'...'}],
  flashcards:[{disciplina:'Direito Tributário',frente:'Pergunta',verso:'Resposta'}],
  questoes:[{disciplina:'Direito Tributário',enunciado:'...',alternativas:['A','B','C','D','E'],correta:2,comentario:'...',fonte:'FGV 2022'}],
  topicos:[{disciplina:'Direito Tributário',nome:'Novo tópico'}]};
function dados(){
  const isMobile=/Android|iPhone|iPad/i.test(navigator.userAgent);
  $('#app').innerHTML=`
  <div class="card" style="margin-bottom:14px"><h3>🔄 Material da sua conta do Estratégia</h3>
    <p class="small">O <b>sincronizador</b> (pasta <code>sync</code> do repositório) entra na área do aluno pelo seu computador, baixa PDFs, resumos, mapas mentais, áudios e os links dos vídeos, e organiza por disciplina. Depois importe a pasta <code>material</code> aqui.</p>
    <pre class="code">cd sync
npm install
npm run login     # faça login na janela que abre
npm run sync      # baixa tudo para a pasta material/</pre>
    <div class="row">
      ${isMobile?'':'<label class="btn">📂 Importar pasta sincronizada<input type="file" id="impPasta" webkitdirectory multiple hidden></label>'}
      <label class="btn ghost">📑 Importar arquivos (vários)<input type="file" id="impArqs" accept="application/pdf,audio/*,video/*,.json,.mp3,.m4a,.mp4" multiple hidden></label>
    </div>
    <p class="small muted" style="margin-bottom:0">${isMobile?'No celular, selecione vários arquivos de uma vez (inclua o manifest.json para a classificação automática) — ou importe pelo computador e traga o backup.':'A disciplina é reconhecida pelo manifest.json ou pelo nome da subpasta.'}</p>
  </div>
  <div class="grid g2">
    <div class="card"><h3>📥 Importar pacote de estudo (.json)</h3>
      <p class="small">Use para trazer resumos, flashcards e questões gerados a partir dos e-mails do Estratégia (o Claude monta este arquivo lendo sua caixa de entrada pelo conector do Gmail). As disciplinas são reconhecidas pelo nome.</p>
      <label class="btn">Escolher arquivo<input type="file" id="impFile" accept=".json,application/json" hidden></label>
      <details style="margin-top:10px"><summary class="small muted" style="cursor:pointer">Formato do arquivo</summary><pre class="code">${esc(JSON.stringify(EXEMPLO_IMPORT,null,2))}</pre></details>
    </div>
    <div class="card"><h3>💾 Backup</h3>
      <p class="small">Seu progresso fica salvo neste navegador. Exporte com frequência para não perder (e para levar para outro computador/celular). PDFs não entram no backup — reenvie-os se trocar de aparelho.</p>
      <div class="row"><button class="btn" id="expBtn">Exportar backup</button><label class="btn ghost">Restaurar backup<input type="file" id="resFile" accept=".json" hidden></label></div>
      <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
      <button class="btn bad sm" id="resetBtn">Apagar tudo e recomeçar</button>
    </div>
  </div>`;
  const impSync=async e=>{if(!e.target.files.length)return;const n=await importarPasta(e.target.files);toast(`${n} material(is) importado(s)`);e.target.value='';render()};
  const ip=$('#impPasta');if(ip)ip.onchange=impSync;$('#impArqs').onchange=impSync;
  $('#impFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const r=await importarPacote(JSON.parse(await f.text()));toast(r)}catch(err){toast('Arquivo inválido: '+err.message)}e.target.value=''};
  $('#expBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'rumoReceita',versao:1,estado:S},null,1)],{type:'application/json'}));a.download=`backup-auditor-${hoje()}.json`;a.click()};
  $('#resFile').onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());if(!j.estado?.disciplinas)throw new Error('não é um backup');if(confirm('Substituir todo o progresso atual pelo backup?')){S=j.estado;salvar();toast('Backup restaurado');render()}}catch(err){toast('Erro: '+err.message)}};
  $('#resetBtn').onclick=()=>{if(confirm('Apagar TODO o progresso? (exporte um backup antes)')){S=estadoInicial();seed();salvar();render()}};
}
async function importarPacote(p){
  let n={m:0,f:0,q:0,t:0},ignor=0;
  const resolve=nome=>{let d=discPorNome(nome);if(!d&&nome){d={id:uid(),nome,bloco:'Específicos',peso:2,topicos:[]};S.disciplinas.push(d)}return d};
  for(const m of p.materiais||[]){const d=resolve(m.disciplina);if(!d||!m.texto){ignor++;continue}await addMaterialTexto(d.id,m.titulo||'Material importado',m.texto);n.m++}
  for(const c of p.flashcards||[]){const d=resolve(c.disciplina);if(!d||!c.frente||!c.verso){ignor++;continue}if(S.cards.some(x=>x.frente===c.frente))continue;S.cards.push(novoCard(d.id,c.frente,c.verso));n.f++}
  for(const q of p.questoes||[]){const d=resolve(q.disciplina);if(!d||!q.enunciado||!Array.isArray(q.alternativas)||!(q.correta in q.alternativas)){ignor++;continue}
    if(S.questoes.some(x=>x.enunciado===q.enunciado))continue;S.questoes.push({id:uid(),disc:d.id,enunciado:q.enunciado,alternativas:q.alternativas,correta:q.correta,comentario:q.comentario||'',fonte:q.fonte||p.fonte||'',hist:[]});n.q++}
  for(const l of p.leis||[]){const d=resolve(l.disciplina);if(!d||!l.ref||!l.texto)continue;if(S.leis.some(x=>x.ref===l.ref))continue;S.leis.push({id:uid(),disc:d.id,ref:l.ref,texto:l.texto,nota:l.nota||''});n.t++}
  for(const t of p.topicos||[]){const d=resolve(t.disciplina);if(!d||!t.nome)continue;if(!d.topicos.some(x=>norm(x.nome)===norm(t.nome))){d.topicos.push({id:uid(),nome:t.nome,status:0,estudadoEm:'',revisoes:[]});n.t++}}
  salvar();render();
  return `Importado: ${n.m} materiais, ${n.f} flashcards, ${n.q} questões, ${n.t} tópicos${ignor?` (${ignor} itens inválidos ignorados)`:''}`;
}

/* ============ Tema ============ */
const temaSalvo=(()=>{try{return localStorage.getItem('rumoReceita:tema')}catch(e){return null}})();
if(temaSalvo)document.documentElement.dataset.theme=temaSalvo;
const alternarTema=()=>{const dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  const t=dark?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('rumoReceita:tema',t)}catch(e){}};
$('#themeBtn').onclick=alternarTema;$('#themeBtn2').onclick=alternarTema;

if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
salvar();render();
// Conteúdo publicado no repositório (conteudo/pacote.json): carregado automaticamente quando há versão nova.
(async()=>{try{const r=await fetch('conteudo/pacote.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)return;const p=await r.json();
  if(!p.versao||p.versao===S.config.conteudoVersao)return;const msg=await importarPacote(p);S.config.conteudoVersao=p.versao;salvar();render();toast('Conteúdo atualizado: '+msg)}catch(e){}})();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
